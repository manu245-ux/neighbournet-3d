<body class="bg-slate-950 text-slate-100 min-h-screen selection:bg-sky-500/20 selection:text-sky-300">

      },
      {
        complaintId: 'NN-2026-0005',
        title: 'Suspicious trespasser inspecting door locks at night',

        buildingId: 'bldg-d',
        floorId: 'bldg-d-f4',
        exactLocation: 'Outer Doorway Flats 401-402',
        locationZone: 'FLAT_DOOR_AREA',
        reporterId: 'user-4',
        priority: 'urgent',

        createdAt: '2026-10-30T03:15:00Z',

      },
      {
        complaintId: 'NN-2026-0006',
        title: 'Damaged asphalt pothole at vehicle exit curve',
        category: 'Road Damage',
        description: 'Deep tire rut exposing sharp gravel bed right before Gate 2 exit boom barrier.',
        buildingId: 'bldg-a',
        floorId: 'bldg-a-f0',
        exactLocation: 'Perimeter Road near Security Cabin',
        locationZone: 'COMMON_AREA',
        reporterId: 'res-demo',
        priority: 'low',
        status: 'RESOLVED',
        visibility: 'public',
        assignedTeamId: 'team-general',
        resolutionNote: 'Pothole filled with cold-mix asphalt and compacted by civil team.',

        possibleDuplicateOf: [],
        confirmationCounts: { stillExists: 0, resolved: 4 }
      }
    ];

    const INITIAL_TIMELINES = [
      { id: 't-1', complaintId: 'NN-2026-0001', action: 'SUBMITTED', newStatus: 'PENDING_VERIFICATION', updatedBy: 'Kavita Sharma', role: 'resident', remarks: 'Complaint lodged via Resident Portal', timestamp: '2026-10-30T09:15:00Z' },
      { id: 't-2', complaintId: 'NN-2026-0001', action: 'APPROVED', newStatus: 'APPROVED', updatedBy: 'Major Vikram Rathore (Retd.)', role: 'admin', remarks: 'Water leakage confirmed by security guard.', timestamp: '2026-10-30T09:45:00Z' },
      { id: 't-3', complaintId: 'NN-2026-0001', action: 'ASSIGNED', newStatus: 'ASSIGNED', updatedBy: 'Major Vikram Rathore (Retd.)', role: 'admin', remarks: 'Assigned to Plumbing & Water Works (Ramesh - Plumber)', timestamp: '2026-10-30T10:00:00Z' },
      { id: 't-4', complaintId: 'NN-2026-0001', action: 'IN_PROGRESS', newStatus: 'IN_PROGRESS', updatedBy: 'Major Vikram Rathore (Retd.)', role: 'admin', remarks: 'Technician on-site isolating water supply valve.', timestamp: '2026-10-30T11:00:00Z' }
    ];

    const INITIAL_NOTIFICATIONS = [
      { id: 'n-1', userId: 'res-demo', complaintId: 'NN-2026-0001', title: 'Work In Progress', message: 'Your complaint NN-2026-0001 is now In Progress with Plumbing Team.', read: false, time: '2026-10-30T11:00:00Z' },
      { id: 'n-2', userId: 'res-demo', complaintId: 'NN-2026-0002', title: 'Complaint Approved', message: 'Your complaint NN-2026-0002 has been verified by society admin.', read: true, time: '2026-10-30T11:15:00Z' }
    ];

    // --- Helper Functions ---
    const getStored = (key, fallback) => {
      const val = localStorage.getItem(key);
      return val ? JSON.parse(val) : fallback;
    };
    const setStored = (key, val) => localStorage.setItem(key, JSON.stringify(val));

    // Duplicate detection function
    const detectDupes = (newTicket, existing) => {
      const stopwords = new Set(['the','a','an','is','in','at','on','for','to','of','near','door','floor','and','this','that','our','my']);
      const cleanTokens = (str) => str.toLowerCase().replace(/[^a-z0-9\s]/g, ' ').split(/\s+/).filter(w => w.length > 2 && !stopwords.has(w));

      const candidates = existing.filter(c => 
        c.buildingId === newTicket.buildingId && 
        c.floorId === newTicket.floorId && 
        c.category === newTicket.category &&
        ['PENDING_VERIFICATION', 'APPROVED', 'ASSIGNED', 'IN_PROGRESS'].includes(c.status)
      );

      const newTokens = new Set([...cleanTokens(newTicket.title), ...cleanTokens(newTicket.description)]);
      return candidates.filter(cand => {
        const sameZone = cand.locationZone === newTicket.locationZone;
        const candTokens = [...cleanTokens(cand.title), ...cleanTokens(cand.description)];
        const matchCount = candTokens.filter(t => newTokens.has(t)).length;
        return sameZone || matchCount >= 2;
      });
    };

    // --- Main Application Component ---
    function App() {
      const [view, setView] = useState('map'); // 'map', 'floor', 'report', 'complaint', 'dashboard', 'feed', 'notifications', 'admin'
      const [currentUser, setCurrentUser] = useState(INITIAL_USERS[0]);
      const [complaints, setComplaints] = useState(() => getStored('NN_COMPS', INITIAL_COMPLAINTS));
      const [timelines, setTimelines] = useState(() => getStored('NN_TIMES', INITIAL_TIMELINES));
      const [notifications, setNotifications] = useState(() => getStored('NN_NOTIFS', INITIAL_NOTIFICATIONS));
      const [selectedBuilding, setSelectedBuilding] = useState('bldg-a');
      const [selectedFloor, setSelectedFloor] = useState('bldg-a-f2');
      const [activeComplaintId, setActiveComplaintId] = useState('NN-2026-0001');

      // Persistence
      useEffect(() => setStored('NN_COMPS', complaints), [complaints]);
      useEffect(() => setStored('NN_TIMES', timelines), [timelines]);
      useEffect(() => setStored('NN_NOTIFS', notifications), [notifications]);

      const unreadCount = notifications.filter(n => n.userId === currentUser.userId && !n.read).length;

      const resetAllData = () => {
        if (confirm('Reset all demo data back to baseline seed records?')) {
          setComplaints(INITIAL_COMPLAINTS);
          setTimelines(INITIAL_TIMELINES);
          setNotifications(INITIAL_NOTIFICATIONS);
          setCurrentUser(INITIAL_USERS[0]);
          setView('map');
          alert('Demo records cleanly reset!');
        }
      };

      const handleAddComplaint = (ticketData, duplicateIds = []) => {
        const currentYear = new Date().getFullYear();
        const nextNum = complaints.length + 1;
        const newId = `NN-${currentYear}-${String(nextNum).padStart(4, '0')}`;
        const now = new Date().toISOString();

        const newRec = {
          ...ticketData,
          complaintId: newId,
          status: 'PENDING_VERIFICATION',
          createdAt: now,
          possibleDuplicateOf: duplicateIds,
          confirmationCounts: { stillExists: 0, resolved: 0 }
        };

        const newTimeline = {
          id: 't-' + Date.now(),
          complaintId: newId,
          action: 'SUBMITTED',
          newStatus: 'PENDING_VERIFICATION',
          updatedBy: currentUser.name,
          role: currentUser.role,
          remarks: 'Complaint lodged via portal',
          timestamp: now
        };

        const newNotif = {
          id: 'n-' + Date.now(),
          userId: currentUser.userId,
          complaintId: newId,
          title: 'Complaint Registered',
          message: `Your ticket ${newId} has been successfully logged and is awaiting admin review.`,
          read: false,
          time: now
        };

        setComplaints([newRec, ...complaints]);
        setTimelines([...timelines, newTimeline]);
        setNotifications([newNotif, ...notifications]);
        setActiveComplaintId(newId);
        setView('complaint');
      };

      const handleUpdateStatus = (id, newStatus, details) => {
        const now = new Date().toISOString();
        setComplaints(complaints.map(c => {
          if (c.complaintId === id) {
            return {
              ...c,
              status: newStatus,
              ...(details.priority && { priority: details.priority }),
              ...(details.teamId && { assignedTeamId: details.teamId }),
              ...(details.staffName && { assignedTo: details.staffName }),
              ...(details.eta && { expectedResolutionAt: details.eta }),
              ...(details.resolutionNote && { resolutionNote: details.resolutionNote, resolvedAt: now }),
              ...(details.remarks && newStatus === 'REJECTED' && { rejectionReason: details.remarks })
            };
          }
          return c;
        }));

        setTimelines([...timelines, {
          id: 't-' + Date.now(),
          complaintId: id,
          action: newStatus,
          newStatus,
          updatedBy: currentUser.name,
          role: currentUser.role,
          remarks: details.remarks || details.resolutionNote || `Status updated to ${newStatus}`,
          timestamp: now
        }]);

        const targetComp = complaints.find(c => c.complaintId === id);
        if (targetComp) {
          setNotifications([{
            id: 'n-' + Date.now(),
            userId: targetComp.reporterId,
            complaintId: id,
            title: `Ticket ${id} ${newStatus.replace('_', ' ')}`,
            message: `Your complaint ${id} status changed to ${newStatus.replace('_', ' ')}.`,
            read: false,
            time: now
          }, ...notifications]);
        }
      };

      return (
        <div className="flex flex-col min-h-screen">
          {/* Top Navbar */}
          <header className="sticky top-0 z-50 bg-slate-950/85 backdrop-blur-md border-b border-slate-800">
            <div className="max-w-7xl mx-auto px-4 h-16 flex items-center justify-between">
              
              <div className="flex items-center gap-6">
                <div onClick={() => setView('map')} className="flex items-center gap-2 cursor-pointer">
                  <div className="w-9 h-9 rounded-xl bg-gradient-to-tr from-sky-500 to-indigo-600 flex items-center justify-center font-bold text-white shadow-md shadow-sky-500/20">
                    🏢
                  </div>
                  <div>
                    <span className="font-bold text-white flex items-center gap-1.5 text-sm">
                      NeighbourNet <span className="text-xs bg-sky-500/20 text-sky-400 px-1.5 py-0.5 rounded border border-sky-500/30">3D</span>
                    </span>
                    <p className="text-[10px] text-slate-400">Green Valley Residency</p>
                  </div>
                </div>

                <nav className="hidden md:flex items-center gap-1 text-xs font-semibold">
                  <button onClick={() => setView('map')} className={`px-3 py-1.5 rounded-lg ${view === 'map' || view === 'floor' ? 'bg-sky-500/10 text-sky-400' : 'text-slate-300 hover:text-white'}`}>
                    Campus Map
                  </button>
                  <button onClick={() => setView('dashboard')} className={`px-3 py-1.5 rounded-lg ${view === 'dashboard' ? 'bg-sky-500/10 text-sky-400' : 'text-slate-300 hover:text-white'}`}>
                    Resident Hub
                  </button>
                  <button onClick={() => setView('feed')} className={`px-3 py-1.5 rounded-lg ${view === 'feed' ? 'bg-sky-500/10 text-sky-400' : 'text-slate-300 hover:text-white'}`}>
                    Community Feed
                  </button>
                  {currentUser.role === 'admin' && (
                    <button onClick={() => setView('admin')} className={`px-3 py-1.5 rounded-lg ${view === 'admin' ? 'bg-purple-500/20 text-purple-300 border border-purple-500/30' : 'text-purple-300 hover:bg-purple-900/30'}`}>
                      Admin Console
                    </button>
                  )}
                </nav>
              </div>

              {/* Right Controls */}
              <div className="flex items-center gap-2.5">

                  <span className="w-2 h-2 rounded-full bg-emerald-400 animate-ping"></span>
                  Demo Mode
                </div>

                <button onClick={resetAllData} title="Reset demo data" className="px-2 py-1 rounded bg-slate-800 hover:bg-slate-700 text-slate-300 text-xs border border-slate-700">
                  ↺ Reset
                </button>

                {/* Persona Switcher */}
                <div className="flex items-center bg-slate-900 border border-slate-800 rounded-lg p-0.5 text-xs">
                  <button
                    onClick={() => setCurrentUser(INITIAL_USERS[0])}

                    Resident

                  <button

                    Admin
                  </button>
                </div>

                {/* Notification Bell */}
                <button onClick={() => setView('notifications')} className="relative p-2 text-slate-400 hover:text-white">
                  🔔
                  {unreadCount > 0 && (
                    <span className="absolute top-1 right-1 bg-rose-500 text-white text-[10px] font-bold w-4 h-4 rounded-full flex items-center justify-center">
                      {unreadCount}
                    </span>
                  )}
                </button>
              </div>

            </div>
          </header>

          {/* Main Content View Switcher */}
          <main className="flex-1 max-w-7xl mx-auto w-full p-4 sm:p-6">
            
            {/* VIEW 1: CAMPUS MAP */}
            {view === 'map' && (
              <div className="space-y-6">
                <div className="flex flex-col sm:flex-row justify-between sm:items-center gap-4">
                  <div>
                    <h1 className="text-2xl font-extrabold text-white">Interactive Society Campus</h1>
                    <p className="text-xs text-slate-400">Green Valley Residency • Select a tower to inspect floors</p>
                  </div>
                  <button
                    onClick={() => setView('report')}
                    className="px-4 py-2 bg-sky-500 hover:bg-sky-400 text-white text-xs font-bold rounded-xl shadow-lg shadow-sky-500/25 flex items-center gap-1.5 self-start sm:self-auto"
                  >
                    + Report Issue
                  </button>
                </div>

                <div className="grid grid-cols-1 lg:grid-cols-3 gap-6">
                  {/* SVG Map (2/3) */}
                  <div className="lg:col-span-2 bg-slate-900 border border-slate-800 rounded-2xl p-4 shadow-2xl relative">
                    <div className="absolute top-4 left-4 bg-slate-950/80 px-3 py-1 rounded-lg border border-slate-700 text-xs text-slate-300">
                      Level 1: Campus Vector View
                    </div>
                    <svg viewBox="0 0 800 560" className="w-full h-auto select-none">
                      <rect width="800" height="560" fill="#064e3b" fillOpacity="0.3" rx="16" />
                      <path d="M 360 0 L 440 0 L 440 560 L 360 560 Z" fill="#1e293b" />
                      <path d="M 0 250 L 800 250 L 800 310 L 0 310 Z" fill="#1e293b" />
                      <circle cx="400" cy="280" r="40" fill="#059669" />
                      <text x="400" y="284" textAnchor="middle" fill="#ecfdf5" fontSize="10" fontWeight="bold">FOUNTAIN</text>
                      
                      {/* Gate */}
                      <rect x="360" y="520" width="80" height="30" rx="4" fill="#475569" />
                      <text x="400" y="540" textAnchor="middle" fill="#ffffff" fontSize="10" fontWeight="bold">MAIN GATE</text>

                      {/* Towers */}
                      {[
                        { id: 'bldg-a', name: 'Building A', x: 80, y: 60, w: 220, h: 150 },
                        { id: 'bldg-b', name: 'Building B', x: 500, y: 60, w: 220, h: 150 },
                        { id: 'bldg-c', name: 'Building C', x: 80, y: 340, w: 220, h: 150 },
                        { id: 'bldg-d', name: 'Building D', x: 500, y: 340, w: 220, h: 150 }
                      ].map(b => {
                        const count = complaints.filter(c => c.buildingId === b.id && !['RESOLVED', 'REJECTED', 'WITHDRAWN'].includes(c.status)).length;
                        const isSel = selectedBuilding === b.id;
                        return (
                          <g key={b.id} className="cursor-pointer" onClick={() => setSelectedBuilding(b.id)}>
                            <rect x={b.x+6} y={b.y+6} width={b.w} height={b.h} rx="12" fill="#020617" fillOpacity="0.7" />
                            <rect x={b.x} y={b.y} width={b.w} height={b.h} rx="12" fill={isSel ? '#1e293b' : '#0f172a'} stroke={isSel ? '#38bdf8' : '#334155'} strokeWidth={isSel ? 3.5 : 1.5} />
                            <text x={b.x + b.w/2} y={b.y + 45} textAnchor="middle" fill="#ffffff" fontSize="16" fontWeight="bold">{b.name}</text>
                            <text x={b.x + b.w/2} y={b.y + 70} textAnchor="middle" fill="#94a3b8" fontSize="11">5 Floors • 20 Flats</text>
                            <g transform={`translate(${b.x + b.w/2 - 45}, ${b.y + 95})`}>
                              <rect width="90" height="26" rx="13" fill={count > 0 ? '#f59e0b25' : '#10b98125'} stroke={count > 0 ? '#f59e0b' : '#10b981'} strokeWidth="1.5" />
                              <circle cx="16" cy="13" r="4.5" fill={count > 0 ? '#f59e0b' : '#10b981'} />
                              <text x="50" y="17" textAnchor="middle" fill="#ffffff" fontSize="10" fontWeight="bold">{count === 0 ? 'Clear' : `${count} Active`}</text>
                            </g>
                          </g>
                        );
                      })}
                    </svg>
                  </div>

                  {/* Building Inspector (1/3) */}
                  <div className="bg-slate-900 border border-slate-800 rounded-2xl p-6 shadow-xl space-y-4">
                    <span className="text-[10px] uppercase font-bold text-sky-400">Tower Details</span>
                    <h2 className="text-2xl font-bold text-white capitalize">{selectedBuilding.replace('bldg-', 'Building ').toUpperCase()}</h2>
                    <p className="text-xs text-slate-400">Select a floor to view zones & pins:</p>

                    <div className="space-y-2">
                      {[4, 3, 2, 1, 0].map(fNum => {
                        const fid = `${selectedBuilding}-f${fNum}`;
                        const count = complaints.filter(c => c.floorId === fid && !['RESOLVED', 'REJECTED', 'WITHDRAWN'].includes(c.status)).length;
                        return (
                          <button
                            key={fid}
                            onClick={() => { setSelectedFloor(fid); setView('floor'); }}
                            className="w-full flex items-center justify-between p-3 rounded-xl bg-slate-950/70 hover:bg-slate-800 border border-slate-800 transition-colors text-left"
                          >
                            <div>
                              <p className="text-xs font-bold text-white">{fNum === 0 ? 'Ground Floor' : `Floor ${fNum}`}</p>
                              <p className="text-[10px] text-slate-500">Flats {fNum}01 to {fNum}04</p>
                            </div>
                            <span className={`px-2 py-0.5 rounded-full text-[10px] font-bold ${count > 0 ? 'bg-amber-500/20 text-amber-300 border border-amber-500/40' : 'bg-emerald-500/10 text-emerald-400'}`}>
                              {count > 0 ? `${count} Issues` : 'Clear'}
                            </span>
                          </button>
                        );
                      })}
                    </div>

                    <button
                      onClick={() => setView('report')}
                      className="w-full py-2.5 rounded-xl bg-slate-800 hover:bg-slate-700 text-sky-400 text-xs font-bold border border-slate-700"

                      + Report Issue in this Building
                    </button>
                  </div>
                </div>
              </div>

            {/* VIEW 2: FLOOR SCHEMATIC */}
            {view === 'floor' && (
              <div className="space-y-6">

                  <button onClick={() => setView('map')} className="text-xs text-slate-400 hover:text-white">

                  <div className="flex justify-between items-center border-b border-slate-800 pb-3">
                    <h2 className="text-lg font-bold text-white uppercase">{selectedFloor.replace('-f', ' Floor ')}</h2>
                    <span className="text-xs text-slate-400">Click any marker to inspect</span>
                  </div>

                  <svg viewBox="0 0 800 380" className="w-full h-auto select-none">
                    <rect x="40" y="20" width="720" height="340" rx="12" fill="#0f172a" stroke="#334155" strokeWidth="2" />
                    {/* Flat 1 */}
                    <rect x="60" y="40" width="200" height="110" rx="6" fill="#1e293b" />
                    <text x="160" y="95" textAnchor="middle" fill="#cbd5e1" fontSize="14" fontWeight="bold">Flat 01</text>
                    {/* Flat 2 */}
                    <rect x="540" y="40" width="200" height="110" rx="6" fill="#1e293b" />
                    <text x="640" y="95" textAnchor="middle" fill="#cbd5e1" fontSize="14" fontWeight="bold">Flat 02</text>
                    {/* Corridor */}
                    <rect x="280" y="40" width="240" height="190" fill="#1e293b" fillOpacity="0.4" stroke="#64748b" strokeDasharray="4 4" rx="4" />
                    <text x="400" y="140" textAnchor="middle" fill="#94a3b8" fontSize="11" fontWeight="bold">CENTRAL CORRIDOR</text>
                    {/* Lift */}
                    <rect x="540" y="170" width="200" height="70" rx="6" fill="#1e293b" stroke="#38bdf8" />
                    <text x="640" y="210" textAnchor="middle" fill="#bae6fd" fontSize="11" fontWeight="bold">ELEVATOR LOBBY</text>
                    {/* Stairs */}
                    <rect x="60" y="170" width="200" height="70" rx="6" fill="#1e293b" stroke="#ef4444" />
                    <text x="160" y="210" textAnchor="middle" fill="#fca5a5" fontSize="11" fontWeight="bold">STAIRS (FIRE EXIT)</text>
                    {/* Flat 3 */}
                    <rect x="60" y="260" width="200" height="80" rx="6" fill="#1e293b" />
                    <text x="160" y="305" textAnchor="middle" fill="#cbd5e1" fontSize="13" fontWeight="bold">Flat 03</text>
                    {/* Utility */}
                    <rect x="280" y="250" width="240" height="90" rx="6" fill="#1e293b" stroke="#eab308" strokeDasharray="3 3" />
                    <text x="400" y="300" textAnchor="middle" fill="#fde047" fontSize="10" fontWeight="bold">UTILITY RISER</text>
                    {/* Flat 4 */}
                    <rect x="540" y="260" width="200" height="80" rx="6" fill="#1e293b" />
                    <text x="640" y="305" textAnchor="middle" fill="#cbd5e1" fontSize="13" fontWeight="bold">Flat 04</text>

                    {/* Markers */}
                    {complaints.filter(c => c.floorId === selectedFloor).map((c, idx) => {
                      const posMap = {
                        FLAT_DOOR_AREA: { x: 160, y: 100 },
                        CORRIDOR: { x: 400, y: 135 },
                        LIFT_LOBBY: { x: 640, y: 205 },
                        STAIRCASE: { x: 160, y: 205 },
                        COMMON_AREA: { x: 400, y: 295 }
                      };
                      const base = posMap[c.locationZone] || { x: 400, y: 135 };
                      const ox = ((idx % 3) - 1) * 24;
                      const oy = Math.floor(idx / 3) * 20;

                      return (
                        <g key={c.complaintId} transform={`translate(${base.x + ox}, ${base.y + oy})`} className="cursor-pointer" onClick={() => { setActiveComplaintId(c.complaintId); setView('complaint'); }}>
                          <circle cx="0" cy="0" r="12" fill={c.status === 'RESOLVED' ? '#10b981' : c.status === 'IN_PROGRESS' ? '#f97316' : '#eab308'} stroke="#ffffff" strokeWidth="2" />

                        </g>
                      );
                    })}
                  </svg>
                </div>
              </div>
            )}

            {/* VIEW 3: REPORT COMPLAINT FORM WITH ZERO-AI DUPLICATE MODAL */}
            {view === 'report' && (
              <ReportForm
                complaints={complaints}
                currentUser={currentUser}
                defaultBuilding={selectedBuilding}
                defaultFloor={selectedFloor}
                onSubmit={handleAddComplaint}
                onCancel={() => setView('map')}
                onViewTicket={(id) => { setActiveComplaintId(id); setView('complaint'); }}
              />
            )}

            {/* VIEW 4: COMPLAINT DETAIL & TIMELINE */}
            {view === 'complaint' && (
              <ComplaintDetail
                complaint={complaints.find(c => c.complaintId === activeComplaintId)}
                timelines={timelines.filter(t => t.complaintId === activeComplaintId)}
                currentUser={currentUser}
                onBack={() => setView('map')}
                onUpdateStatus={handleUpdateStatus}
              />
            )}

            {/* VIEW 5: RESIDENT DASHBOARD */}
            {view === 'dashboard' && (
              <ResidentDashboardView
                complaints={complaints}
                announcements={INITIAL_ANNOUNCEMENTS}
                currentUser={currentUser}
                onSelectTicket={(id) => { setActiveComplaintId(id); setView('complaint'); }}
                onNewReport={() => setView('report')}
                onWithdraw={(id) => handleUpdateStatus(id, 'WITHDRAWN', { remarks: 'Withdrawn by resident.' })}
              />
            )}

            {/* VIEW 6: COMMUNITY FEED */}
            {view === 'feed' && (
              <CommunityFeedView
                complaints={complaints}
                announcements={INITIAL_ANNOUNCEMENTS}
                onSelectTicket={(id) => { setActiveComplaintId(id); setView('complaint'); }}
                onVote={(id, type) => {
                  setComplaints(complaints.map(c => {
                    if (c.complaintId === id) {
                      return {
                        ...c,
                        confirmationCounts: {
                          ...c.confirmationCounts,
                          [type === 'STILL_EXISTS' ? 'stillExists' : 'resolved']: (c.confirmationCounts?.[type === 'STILL_EXISTS' ? 'stillExists' : 'resolved'] || 0) + 1
                        }
                      };
                    }
                    return c;
                  }));
                  alert('Thank you! Your community confirmation vote was recorded.');
                }}
              />
            )}

            {/* VIEW 7: NOTIFICATIONS */}
            {view === 'notifications' && (
              <div className="max-w-3xl mx-auto space-y-4">
                <div className="flex justify-between items-center border-b border-slate-800 pb-3">
                  <h2 className="text-xl font-bold text-white">In-App Notification Alerts</h2>
                  <button
                    onClick={() => setNotifications(notifications.map(n => ({ ...n, read: true })))}
                    className="text-xs text-sky-400 hover:underline"
                  >
                    Mark all read
                  </button>
                </div>
                {notifications.filter(n => n.userId === currentUser.userId).length === 0 ? (
                  <p className="text-xs text-slate-500 py-8 text-center">Inbox is empty.</p>
                ) : (
                  notifications.filter(n => n.userId === currentUser.userId).map(n => (
                    <div
                      key={n.id}
                      onClick={() => { setActiveComplaintId(n.complaintId); setView('complaint'); }}
                      className={`p-4 rounded-xl border cursor-pointer ${n.read ? 'bg-slate-900 border-slate-800' : 'bg-slate-900 border-sky-500/40 shadow-lg'}`}
                    >
                      <div className="flex justify-between text-xs font-bold text-white mb-1">
                        <span>{n.title}</span>
                        <span className="text-[10px] text-slate-400 font-normal">{new Date(n.time).toLocaleTimeString()}</span>
                      </div>
                      <p className="text-xs text-slate-300">{n.message}</p>
                    </div>
                  ))
                )}
              </div>
            )}

            {/* VIEW 8: ADMIN CONSOLE */}
            {view === 'admin' && (
              <AdminConsoleView
                complaints={complaints}
                teams={INITIAL_TEAMS}
                onSelectTicket={(id) => { setActiveComplaintId(id); setView('complaint'); }}
              />
            )}

          </main>
        </div>
      );
    }

    // --- Sub-Components ---

    function ReportForm({ complaints, currentUser, defaultBuilding, defaultFloor, onSubmit, onCancel, onViewTicket }) {
      const [building, setBuilding] = useState(defaultBuilding);
      const [floor, setFloor] = useState(defaultFloor);
      const [zone, setZone] = useState('CORRIDOR');
      const [cat, setCat] = useState('Electricity Failure');
      const [title, setTitle] = useState('');
      const [desc, setDesc] = useState('');
      const [exactLoc, setExactLoc] = useState('');
      const [dupes, setDupes] = useState([]);
      const [showModal, setShowModal] = useState(false);

      const isEmergency = ['Theft or Suspicious Activity', 'Security Concern', 'Fire or Safety Hazard'].includes(cat);

      const handleFormSubmit = (e) => {
        e.preventDefault();
        if (title.length < 5) return alert('Title minimum 5 characters.');
        if (desc.length < 20) return alert('Description minimum 20 characters.');

        const matches = detectDupes({ buildingId: building, floorId: floor, category: cat, locationZone: zone, title, description: desc }, complaints);
        if (matches.length > 0) {
          setDupes(matches);
          setShowModal(true);
          return;
        }

        saveRecord([]);
      };

      const saveRecord = (duplicateIds) => {
        onSubmit({
          title,
          category: cat,
          description: desc,
          buildingId: building,
          floorId: floor,
          locationZone: zone,
          exactLocation: exactLoc || 'Floor Hallway',
          reporterId: currentUser.userId,
          priority: isEmergency ? 'urgent' : 'high',
          visibility: isEmergency ? 'private' : 'public'
        }, duplicateIds);
      };

      return (
        <div className="max-w-2xl mx-auto space-y-4">
          <button onClick={onCancel} className="text-xs text-slate-400 hover:text-white">← Cancel</button>
          <h2 className="text-2xl font-bold text-white">Log Maintenance or Safety Issue</h2>

          {isEmergency && (
            <div className="bg-rose-950/80 border border-rose-500 rounded-xl p-4 text-xs text-rose-200">
              <strong>CRITICAL NOTICE:</strong> This platform does not replace official emergency services. Dial <strong>112 / 101</strong> for active fires or life danger.
            </div>
          )}

          <form onSubmit={handleFormSubmit} className="bg-slate-900 border border-slate-800 rounded-2xl p-6 space-y-4 text-xs">
            <div>
              <label className="block text-slate-400 font-bold mb-1">Category *</label>
              <select value={cat} onChange={e => setCat(e.target.value)} className="w-full bg-slate-950 border border-slate-800 rounded-lg p-2.5 text-white">
                <option value="Water Leakage">Water Leakage</option>
                <option value="Electricity Failure">Electricity Failure</option>
                <option value="Lift Malfunction">Lift Malfunction</option>
                <option value="Garbage and Sanitation">Garbage and Sanitation</option>
                <option value="Theft or Suspicious Activity">Theft or Suspicious Activity</option>
                <option value="Fire or Safety Hazard">Fire or Safety Hazard</option>
                <option value="Road Damage">Road Damage</option>
              </select>
            </div>

            <div>
              <label className="block text-slate-400 font-bold mb-1">Title * (5–80 chars)</label>
              <input value={title} onChange={e => setTitle(e.target.value)} placeholder="e.g. Corridor light buzzing and flickering" className="w-full bg-slate-950 border border-slate-800 rounded-lg p-2.5 text-white" />
            </div>

            <div className="grid grid-cols-3 gap-3">
              <div>
                <label className="block text-slate-400 font-bold mb-1">Building</label>
                <select value={building} onChange={e => setBuilding(e.target.value)} className="w-full bg-slate-950 border border-slate-800 rounded-lg p-2 text-white">
                  <option value="bldg-a">Tower A</option>
                  <option value="bldg-b">Tower B</option>
                  <option value="bldg-c">Tower C</option>
                  <option value="bldg-d">Tower D</option>
                </select>
              </div>
              <div>
                <label className="block text-slate-400 font-bold mb-1">Floor</label>
                <select value={floor} onChange={e => setFloor(e.target.value)} className="w-full bg-slate-950 border border-slate-800 rounded-lg p-2 text-white">
                  <option value={`${building}-f0`}>Ground Floor</option>
                  <option value={`${building}-f1`}>Floor 1</option>
                  <option value={`${building}-f2`}>Floor 2</option>
                  <option value={`${building}-f3`}>Floor 3</option>
                  <option value={`${building}-f4`}>Floor 4</option>
                </select>
              </div>
              <div>
                <label className="block text-slate-400 font-bold mb-1">Zone</label>
                <select value={zone} onChange={e => setZone(e.target.value)} className="w-full bg-slate-950 border border-slate-800 rounded-lg p-2 text-white">
                  <option value="CORRIDOR">Corridor</option>
                  <option value="LIFT_LOBBY">Lift Lobby</option>
                  <option value="FLAT_DOOR_AREA">Flat Door</option>
                  <option value="STAIRCASE">Staircase</option>
                  <option value="COMMON_AREA">Utility Area</option>
                </select>
              </div>
            </div>

            <div>
              <label className="block text-slate-400 font-bold mb-1">Exact Landmark</label>
              <input value={exactLoc} onChange={e => setExactLoc(e.target.value)} placeholder="e.g. Near Door 203 ceiling" className="w-full bg-slate-950 border border-slate-800 rounded-lg p-2.5 text-white" />
            </div>

            <div>
              <label className="block text-slate-400 font-bold mb-1">Description * (20–500 chars)</label>
              <textarea rows={3} value={desc} onChange={e => setDesc(e.target.value)} placeholder="Describe when it began, sparking, odors, etc..." className="w-full bg-slate-950 border border-slate-800 rounded-lg p-2.5 text-white" />
            </div>

            <button type="submit" className="w-full py-3 bg-sky-500 hover:bg-sky-400 text-white font-bold rounded-xl shadow-lg shadow-sky-500/25">
              Submit Complaint
            </button>
          </form>

          {/* Duplicate Modal */}
          {showModal && (
            <div className="fixed inset-0 z-50 bg-black/80 flex items-center justify-center p-4">
              <div className="bg-slate-900 border border-amber-500/50 rounded-2xl max-w-lg w-full p-6 space-y-4">
                <h3 className="text-base font-bold text-amber-400">⚠️ Possible Duplicate Complaint Detected</h3>
                <p className="text-xs text-slate-300">An active report with matching keywords already exists on this floor:</p>
                <div className="bg-slate-950 p-3 rounded-xl border border-slate-800 text-xs space-y-1">
                  <p className="font-mono text-sky-400 font-bold">{dupes[0].complaintId}</p>
                  <p className="font-bold text-white">{dupes[0].title}</p>
                  <p className="text-slate-400 text-[11px]">{dupes[0].description}</p>
                </div>
                <div className="flex justify-end gap-2 text-xs font-semibold">
                  <button onClick={() => onViewTicket(dupes[0].complaintId)} className="px-3 py-2 rounded-lg bg-slate-800 text-slate-200">
                    View Existing
                  </button>
                  <button onClick={() => saveRecord(dupes.map(d => d.complaintId))} className="px-3 py-2 rounded-lg bg-amber-500 text-slate-950 font-bold">
                    Continue with New Report
                  </button>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    function ComplaintDetail({ complaint, timelines, currentUser, onBack, onUpdateStatus }) {
      if (!complaint) return <div className="text-center py-12">Complaint not found.</div>;

      const isAdmin = currentUser.role === 'admin';
      const [showActionModal, setShowActionModal] = useState(false);
      const [actionType, setActionType] = useState('approve');
      const [inputVal, setInputVal] = useState('');

      return (
        <div className="max-w-3xl mx-auto space-y-6">
          <div className="flex justify-between items-center">
            <button onClick={onBack} className="text-xs text-slate-400 hover:text-white">← Back</button>
            {isAdmin && (
              <button onClick={() => setShowActionModal(true)} className="px-3 py-1.5 bg-purple-600 hover:bg-purple-500 text-white text-xs font-bold rounded-lg shadow-md">
                Admin Triage Actions
              </button>
            )}
          </div>

          <div className="bg-slate-900 border border-slate-800 rounded-2xl p-6 space-y-4 shadow-xl">
            <div className="flex justify-between items-center">
              <span className="font-mono text-xs font-bold text-sky-400 bg-sky-500/10 px-2.5 py-0.5 rounded border border-sky-500/30">
                {complaint.complaintId}
              </span>
              <span className="text-xs font-bold px-2 py-0.5 rounded bg-slate-800 text-amber-300">
                {complaint.status}
              </span>
            </div>

            <h1 className="text-xl font-bold text-white">{complaint.title}</h1>
            <p className="text-xs text-slate-300 leading-relaxed bg-slate-950 p-4 rounded-xl border border-slate-800">
              {complaint.description}
            </p>

            <div className="flex gap-4 text-xs text-slate-400 pt-2 border-t border-slate-800">
              <span>Tower: <strong className="text-white">{complaint.buildingId.toUpperCase()}</strong></span>
              <span>Floor: <strong className="text-white">{complaint.floorId}</strong></span>
              <span>Zone: <strong className="text-white">{complaint.locationZone}</strong></span>
            </div>
          </div>

          {/* Chronological Stepper */}
          <div className="bg-slate-900 border border-slate-800 rounded-2xl p-6 space-y-4">
            <h3 className="text-sm font-bold text-white">Chronological Audit Stepper</h3>
            <div className="space-y-4 pl-4 border-l-2 border-slate-800">
              {timelines.map(t => (
                <div key={t.id} className="relative pl-4 space-y-1">
                  <div className="absolute -left-[21px] top-1 w-2.5 h-2.5 rounded-full bg-sky-400"></div>
                  <div className="flex justify-between text-xs">
                    <span className="font-bold text-white">{t.action} ({t.newStatus})</span>
                    <span className="text-[10px] text-slate-500">{new Date(t.timestamp).toLocaleTimeString()}</span>
                  </div>
                  {t.remarks && <p className="text-xs text-slate-300 bg-slate-950/60 p-2 rounded">{t.remarks}</p>}
                  <p className="text-[10px] text-slate-500">By {t.updatedBy} ({t.role})</p>
                </div>
              ))}
            </div>
          </div>

          {/* Admin Triage Modal */}
          {showActionModal && (
            <div className="fixed inset-0 z-50 bg-black/80 flex items-center justify-center p-4">
              <div className="bg-slate-900 border border-purple-500/50 rounded-2xl max-w-md w-full p-6 space-y-4 text-xs">
                <h3 className="text-sm font-bold text-purple-300 uppercase">Execute State Transition</h3>
                <div>
                  <label className="block text-slate-400 mb-1">Target Action</label>
                  <select value={actionType} onChange={e => setActionType(e.target.value)} className="w-full bg-slate-950 border border-slate-800 rounded-lg p-2 text-white">
                    <option value="approve">Approve Ticket (APPROVED)</option>
                    <option value="assign">Assign Plumbing Team (ASSIGNED)</option>
                    <option value="progress">Move to In Progress (IN_PROGRESS)</option>
                    <option value="resolve">Mark Resolved (RESOLVED)</option>
                    <option value="reject">Reject Ticket (REJECTED)</option>
                  </select>
                </div>

                <div>
                  <label className="block text-slate-400 mb-1">Remarks / Note *</label>
                  <textarea rows={2} value={inputVal} onChange={e => setInputVal(e.target.value)} placeholder="Enter technician instructions or resolution note..." className="w-full bg-slate-950 border border-slate-800 rounded-lg p-2 text-white" />
                </div>

                <div className="flex justify-end gap-2 pt-2">
                  <button onClick={() => setShowActionModal(false)} className="px-3 py-1.5 rounded-lg bg-slate-800 text-slate-300">Cancel</button>
                  <button
                    onClick={() => {
                      if (actionType === 'approve') onUpdateStatus(complaint.complaintId, 'APPROVED', { remarks: inputVal || 'Approved' });
                      if (actionType === 'assign') onUpdateStatus(complaint.complaintId, 'ASSIGNED', { teamId: 'team-plumbing', staffName: 'Ramesh', remarks: inputVal || 'Assigned' });
                      if (actionType === 'progress') onUpdateStatus(complaint.complaintId, 'IN_PROGRESS', { eta: new Date(Date.now() + 14400000).toISOString(), remarks: inputVal || 'On-site' });
                      if (actionType === 'resolve') onUpdateStatus(complaint.complaintId, 'RESOLVED', { resolutionNote: inputVal || 'Fixed' });
                      if (actionType === 'reject') onUpdateStatus(complaint.complaintId, 'REJECTED', { remarks: inputVal || 'Rejected' });
                      setShowActionModal(false);
                    }}
                    className="px-4 py-1.5 rounded-lg bg-sky-500 text-white font-bold"
                  >
                    Confirm Action
                  </button>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    function ResidentDashboardView({ complaints, announcements, currentUser, onSelectTicket, onNewReport, onWithdraw }) {
      const myTickets = complaints.filter(c => c.reporterId === currentUser.userId);
      return (
        <div className="space-y-6">
          <div className="bg-gradient-to-r from-slate-900 to-sky-950 p-6 rounded-2xl border border-slate-800 flex justify-between items-center">
            <div>
              <h2 className="text-xl font-bold text-white">Welcome back, {currentUser.name}</h2>
              <p className="text-xs text-slate-400">{currentUser.building} • Flat {currentUser.apartmentNumber}</p>
            </div>
            <button onClick={onNewReport} className="px-4 py-2 bg-sky-500 text-white text-xs font-bold rounded-xl">
              + Report Issue
            </button>
          </div>

          <div className="grid grid-cols-1 md:grid-cols-3 gap-4 text-xs">
            <div className="bg-slate-900 p-4 rounded-xl border border-slate-800">
              <span className="text-slate-400">Total My Complaints</span>
              <p className="text-2xl font-bold text-white mt-1">{myTickets.length}</p>
            </div>
            <div className="bg-slate-900 p-4 rounded-xl border border-slate-800">
              <span className="text-amber-400">Active / In Progress</span>
              <p className="text-2xl font-bold text-amber-300 mt-1">{myTickets.filter(c => !['RESOLVED', 'REJECTED', 'WITHDRAWN'].includes(c.status)).length}</p>
            </div>
            <div className="bg-slate-900 p-4 rounded-xl border border-slate-800">
              <span className="text-emerald-400">Resolved</span>
              <p className="text-2xl font-bold text-emerald-300 mt-1">{myTickets.filter(c => c.status === 'RESOLVED').length}</p>
            </div>
          </div>

          <div className="bg-slate-900 p-6 rounded-2xl border border-slate-800 space-y-3">
            <h3 className="text-sm font-bold text-white">My Lodged Tickets</h3>
            {myTickets.map(t => (
              <div key={t.complaintId} className="bg-slate-950 p-4 rounded-xl border border-slate-800 flex justify-between items-center text-xs">
                <div>
                  <div className="flex gap-2 items-center mb-1">
                    <span className="font-mono text-sky-400 font-bold">{t.complaintId}</span>
                    <span className="px-2 py-0.5 rounded bg-slate-800 text-[10px] text-amber-300">{t.status}</span>
                  </div>
                  <p className="font-bold text-white">{t.title}</p>
                </div>
                <div className="flex gap-2">
                  {t.status === 'PENDING_VERIFICATION' && (
                    <button onClick={() => onWithdraw(t.complaintId)} className="px-2.5 py-1 bg-rose-950 text-rose-300 rounded border border-rose-800">
                      Withdraw
                    </button>
                  )}
                  <button onClick={() => onSelectTicket(t.complaintId)} className="px-3 py-1 bg-slate-800 text-sky-400 rounded">
                    Track →
                  </button>
                </div>
              </div>
            ))}
          </div>
        </div>
      );
    }

    function CommunityFeedView({ complaints, announcements, onSelectTicket, onVote }) {
      const publicTickets = complaints.filter(c => c.visibility === 'public');
      return (
        <div className="max-w-3xl mx-auto space-y-6">
          <h2 className="text-2xl font-bold text-white">Community Issues Billboard</h2>
          <div className="space-y-4">
            {publicTickets.map(c => (
              <div key={c.complaintId} className="bg-slate-900 p-5 rounded-2xl border border-slate-800 space-y-2 text-xs">
                <div className="flex justify-between items-center">
                  <span className="font-mono text-sky-400 font-bold">{c.complaintId}</span>
                  <span className="text-slate-500">{new Date(c.createdAt).toLocaleDateString()}</span>
                </div>
                <h3 className="text-sm font-bold text-white">{c.title}</h3>
                <p className="text-slate-300">{c.description}</p>
                <div className="flex justify-between items-center pt-2 border-t border-slate-800">
                  <div className="flex gap-2">
                    <button onClick={() => onVote(c.complaintId, 'STILL_EXISTS')} className="px-2.5 py-1 rounded bg-slate-800 text-amber-300 border border-slate-700">
                      ⚠️ Still Exists ({c.confirmationCounts?.stillExists || 0})
                    </button>
                    <button onClick={() => onVote(c.complaintId, 'RESOLVED')} className="px-2.5 py-1 rounded bg-slate-800 text-emerald-300 border border-slate-700">
                      ✓ Resolved ({c.confirmationCounts?.resolved || 0})
                    </button>
                  </div>
                  <button onClick={() => onSelectTicket(c.complaintId)} className="text-sky-400 hover:underline">
                    View Details →
                  </button>
                </div>
              </div>
            ))}
          </div>
        </div>
      );
    }

    function AdminConsoleView({ complaints, teams, onSelectTicket }) {
      return (
        <div className="space-y-6 text-xs">
          <h2 className="text-2xl font-bold text-white">Facility Operations Management Desk</h2>
          <div className="grid grid-cols-4 gap-3">
            <div className="bg-slate-900 p-4 rounded-xl border border-slate-800">
              <span className="text-slate-400">Total</span>
              <p className="text-2xl font-bold text-white mt-1">{complaints.length}</p>
            </div>
            <div className="bg-slate-900 p-4 rounded-xl border border-amber-500/40">
              <span className="text-amber-400">Pending Review</span>
              <p className="text-2xl font-bold text-amber-300 mt-1">{complaints.filter(c => c.status === 'PENDING_VERIFICATION').length}</p>
            </div>
            <div className="bg-slate-900 p-4 rounded-xl border border-sky-500/40">
              <span className="text-sky-400">In Progress</span>
              <p className="text-2xl font-bold text-sky-300 mt-1">{complaints.filter(c => c.status === 'IN_PROGRESS').length}</p>
            </div>
            <div className="bg-slate-900 p-4 rounded-xl border border-emerald-500/40">
              <span className="text-emerald-400">Resolved</span>
              <p className="text-2xl font-bold text-emerald-300 mt-1">{complaints.filter(c => c.status === 'RESOLVED').length}</p>
            </div>
          </div>

          <div className="bg-slate-900 rounded-2xl border border-slate-800 p-4">
            <h3 className="text-sm font-bold text-white mb-3">Triage Queue</h3>
            <div className="space-y-2">
              {complaints.map(c => (
                <div key={c.complaintId} className="bg-slate-950 p-3.5 rounded-xl border border-slate-800 flex justify-between items-center">
                  <div>
                    <span className="font-mono text-sky-400 font-bold mr-2">{c.complaintId}</span>
                    <span className="font-bold text-white mr-2">{c.title}</span>
                    <span className="text-[10px] bg-slate-900 px-2 py-0.5 rounded text-slate-400">{c.category}</span>
                  </div>
                  <button onClick={() => onSelectTicket(c.complaintId)} className="px-3 py-1 bg-purple-600 hover:bg-purple-500 text-white font-bold rounded">
                    Triage →
                  </button>
                </div>
              ))}
            </div>
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
